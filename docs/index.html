<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Study Peaks</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            text-align: center;
            color: white;
        }
        .logo {
            font-size: 4rem;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 8px;
        }
        .tagline {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 32px;
        }
        .links {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .links a {
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .links a:hover {
            background: rgba(255,255,255,0.2);
            border-color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🏔️</div>
        <h1>Global Study Peaks</h1>
        <p class="tagline">Virtual study rooms for focused productivity</p>
        <div class="links">
            <a href="privacy-policy.html">Privacy Policy</a>
            <a href="https://play.google.com/store">Google Play</a>
        </div>
    </div>
</body>
</html>
