name: "study_peaks"
description: "Global Study Peaks - Virtual Study Room Application"
publish_to: 'none'
version: 1.0.31+32

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  jdenticon_dart: ^2.0.0
  flutter_svg: ^2.0.10+1
  country_flags: ^3.0.0
  google_fonts: ^6.2.1
  provider: ^6.1.2
  http: ^1.2.0
  flutter_local_notifications: ^18.0.1
  flutter_foreground_task: ^8.12.0
  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.4.0
  google_sign_in: ^6.2.2
  shared_preferences: ^2.3.4
  uuid: ^4.5.1
  sqflite: ^2.4.2
  path: ^1.9.1
  fl_chart: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  golden_toolkit: ^0.15.0
  flutter_launcher_icons: ^0.14.3
  sqflite_common_ffi: ^2.3.7+1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1A237E"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon/

